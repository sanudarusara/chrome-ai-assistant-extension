<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="container">

    <div class="app-header">

      <img src="assets/icons/icon128.png" alt="AiPal Logo" class="app-logo">

      <div class="app-header-text">

        <h2>AiPal</h2>

        <p class="subtitle">
          Multi AI Assistant - Quick Acces to 8 AIs
        </p>

      </div>

    </div>

    <div class="divider"></div>

    <div class="shortcut-card">
      <Strong>AI</Strong>
      <strong>Enable/Disable</strong>
    </div>

    <div id="ai-settings"></div>

    <details class="guide-card">

      <summary class="guide-title">
        Quick Guide
      </summary>

      <div class="divider" style="width: 92%; margin: 0 auto 16px;"></div>

      <div class="guide-content">

        <div class="guide-item">
          <strong>OPEN AI</strong>
          <span>Right Click → Open AI</span>
        </div>

        <div class="guide-item">
          <strong>ASK AI</strong>
          <span>Select Text → Right Click → Ask AI</span>
        </div>

        <div class="guide-item">
          <strong>CONTINUE CHAT</strong>
          <span>Select Text → Alt + A</span>
        </div>

        <div class="guide-note">
          <img src="assets/icons/info.svg" alt="Info" class="guide-icon">
           Sign in to the AI services before use.
        </div>

        <div class="guide-note">
          <img src="assets/icons/info.svg" alt="Info" class="guide-icon">
           Alt+A not working?Set it in
          <a href="#" id="open-shortcuts">
            <u>Chrome Shortcuts</u>
          </a>
        </div>

      </div>

    </details>

    <div class="footer">
      AiPal - Version 1.0
    </div>

  </div>

  <script type="module" src="popup.js"></script>

</body>

</html>
