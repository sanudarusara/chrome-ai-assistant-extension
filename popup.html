<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="container">

    <h2>AI Selection Assistant</h2>

    <p class="subtitle">
      Quick access to 8 AI providers
    </p>

    <div class="divider"></div>

    <div class="shortcut-card">
      <Strong>AI</Strong>
      <strong>Enable/Disable</strong>
    </div>

    <div id="ai-settings"></div>

    <details class="guide-card">

      <summary class="guide-title">
        Quick Guide
      </summary>

      <div class="divider" style="width: 92%; margin: 0 auto 16px;"></div>

      <div class="guide-content">

        <div class="guide-item">
          <strong>OPEN AI</strong>
          <span>Right Click → AI</span>
        </div>

        <div class="guide-item">
          <strong>ASK AI</strong>
          <span>Select Text → Right Click → AI</span>
        </div>

        <div class="guide-item">
          <strong>CONTINUE CHAT</strong>
          <span>Select Text → Alt + A</span>
        </div>

      </div>

    </details>

    <div class="footer">
      Version 1.0
    </div>

  </div>

  <script type="module" src="popup.js"></script>

</body>

</html>
